syntax = "proto3";

package golang_develop_example.api.v1;

import "google/api/annotations.proto";

option go_package = "golang-develop-example/pkg/api/v1;api";

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {get: "/v1/echo/{message}"};
  }
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}
