version: v1
plugins:
  - plugin: go
    out: .
    opt:
      - paths=import
      - module=golang-develop-example
  - plugin: go-grpc
    out: .
    opt:
      - paths=import
      - module=golang-develop-example
  - plugin: grpc-gateway
    out: .
    opt:
      - paths=import
      - module=golang-develop-example
  - plugin: openapiv2
    out: docs/api
    opt:
      - logtostderr=true
      - output_format=yaml
      - allow_merge=true
      - merge_file_name=openapi.yaml
